services:
  api:
    image: apexbooks-vps-api:1.3.0
    restart: unless-stopped
    init: true
    env_file:
      - ${APEXBOOKS_ENV_FILE:-/opt/apexbooks-vps/shared/server.env}
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - "127.0.0.1:18091:8000"
    cpus: 1.5
    mem_limit: 1g
    pids_limit: 200
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s
  web:
    image: apexbooks-vps-web:1.3.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:18090:80"
    cpus: 0.5
    mem_limit: 192m
    pids_limit: 100
    depends_on:
      api: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
