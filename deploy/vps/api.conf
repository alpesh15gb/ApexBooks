limit_req_zone $binary_remote_addr zone=apexbooks_vps_auth:10m rate=10r/m;
server {
    listen 80;
    server_name api.apexbooks.in;
    return 301 https://api.apexbooks.in$request_uri;
}
server {
    listen 443 ssl;
    server_name api.apexbooks.in;
    ssl_certificate /etc/letsencrypt/live/api.apexbooks.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.apexbooks.in/privkey.pem;
    client_max_body_size 128m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=apexbooks_vps_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18091;
        include /etc/nginx/snippets/apexbooks-vps-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:18091;
        include /etc/nginx/snippets/apexbooks-vps-proxy.conf;
    }
}
