services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: apex
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./backend
      args:
        APEX_BUILD_SHA: ${APEX_SOURCE_SHA:-unknown}
        APEX_RELEASE_VERSION: ${APEX_RELEASE_VERSION:-unknown}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://apex:${POSTGRES_PASSWORD}@db:5432/apex
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_OCR_MODEL: ${OPENAI_OCR_MODEL:-gpt-4o-mini}
      OCR_BASE_URL: ${OCR_BASE_URL:-https://api.openai.com/v1}
      OCR_MODEL: ${OCR_MODEL:-gpt-4o-mini}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      OCR_ALLOW_INSECURE_HTTP: ${OCR_ALLOW_INSECURE_HTTP:-0}
      COMMERCE_ENCRYPTION_KEY: ${COMMERCE_ENCRYPTION_KEY:-}
      COMMERCE_ALLOWED_HOSTS: ${COMMERCE_ALLOWED_HOSTS:-}
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  commerce-worker:
    build:
      context: ./backend
      args:
        APEX_BUILD_SHA: ${APEX_SOURCE_SHA:-unknown}
        APEX_RELEASE_VERSION: ${APEX_RELEASE_VERSION:-unknown}
    profiles: [commerce]
    restart: unless-stopped
    command: ["sh", "-c", "python -c 'from commerce import cipher; cipher()' && exec python commerce_worker.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://apex:${POSTGRES_PASSWORD}@db:5432/apex
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COMMERCE_ENCRYPTION_KEY: ${COMMERCE_ENCRYPTION_KEY:-}
      COMMERCE_ALLOWED_HOSTS: ${COMMERCE_ALLOWED_HOSTS:-}
    depends_on:
      api:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      args:
        VITE_BUILD_SHA: ${APEX_SOURCE_SHA:-unknown}
        APEX_RELEASE_VERSION: ${APEX_RELEASE_VERSION:-unknown}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
