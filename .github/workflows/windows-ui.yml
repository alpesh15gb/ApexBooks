name: Windows native UI smoke
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: windows-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-winui-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      JWT_SECRET: synthetic-windows-ui-ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Require preconfigured interactive desktop
        shell: pwsh
        run: |
          if (-not [Environment]::UserInteractive) {
            throw 'No interactive Windows desktop is available. An already-configured interactive runner is required; this job never changes login, service, UAC, or desktop-security settings.'
          }
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Publish unpackaged Debug app with bundled runtime
        run: dotnet publish native/windows/ApexBooks.Windows.csproj -c Debug -p:Platform=x64 -r win-x64 --self-contained true -p:ApexApiOrigin=http://127.0.0.1:8012 -o "${{ runner.temp }}/windows-ui-app"
      - name: Exercise real UI with a same-step isolated API
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:DATABASE_URL='sqlite:///'+($env:RUNNER_TEMP+'/windows-ui-isolated.sqlite3').Replace('\','/')
          Push-Location backend
          try {
            python migrate.py
            if ($LASTEXITCODE -ne 0) { throw 'Synthetic database migration failed.' }
          } finally { Pop-Location }
          $api=Start-Process python -ArgumentList '-m','uvicorn','main:app','--app-dir','backend','--host','127.0.0.1','--port','8012' -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/windows-ui-api.log" -RedirectStandardError "$env:RUNNER_TEMP/windows-ui-api-error.log"
          try {
            $ready=$false
            for ($attempt=0;$attempt -lt 60;$attempt++) {
              $api.Refresh()
              if ($api.HasExited) { throw "Synthetic API exited before readiness (code $($api.ExitCode))." }
              try { Invoke-RestMethod http://127.0.0.1:8012/api/ready | Out-Null; $ready=$true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Synthetic loopback API failed to become ready.' }
            # Keep API and UI runner in this shell lifetime; never depend on a
            # background process surviving between GitHub Actions steps.
            Invoke-RestMethod http://127.0.0.1:8012/api/ready | Out-Null
            dotnet run --project native/tests/WindowsUi -c Release -- "$env:RUNNER_TEMP/windows-ui-app" http://127.0.0.1:8012 "$env:RUNNER_TEMP/windows-ui-evidence"
            if ($LASTEXITCODE -ne 0) { throw "Windows UI smoke failed (exit $LASTEXITCODE)." }
          } finally {
            $api.Refresh()
            if (-not $api.HasExited) { Stop-Process -Id $api.Id -ErrorAction SilentlyContinue }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-ui-evidence
          path: |
            ${{ runner.temp }}/windows-ui-evidence
            ${{ runner.temp }}/windows-ui-api*.log
