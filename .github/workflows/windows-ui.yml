name: Windows native UI smoke
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: windows-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-winui-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      JWT_SECRET: synthetic-windows-ui-ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Require preconfigured interactive desktop
        shell: pwsh
        run: |
          if (-not [Environment]::UserInteractive) {
            throw 'No interactive Windows desktop is available. An already-configured interactive runner is required; this job never changes login, service, UAC, or desktop-security settings.'
          }
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Start isolated synthetic API
        shell: pwsh
        run: |
          $env:DATABASE_URL='sqlite:///'+($env:RUNNER_TEMP+'/windows-ui-isolated.sqlite3').Replace('\','/')
          Push-Location backend
          python migrate.py
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic database migration failed.' }
          Pop-Location
          $api=Start-Process python -ArgumentList '-m','uvicorn','main:app','--app-dir','backend','--host','127.0.0.1','--port','8012' -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/windows-ui-api.log" -RedirectStandardError "$env:RUNNER_TEMP/windows-ui-api-error.log"
          $api.Id | Set-Content "$env:RUNNER_TEMP/windows-ui-api.pid"
          for ($attempt=0;$attempt -lt 60;$attempt++) {
            try { Invoke-RestMethod http://127.0.0.1:8012/api/ready | Out-Null; exit 0 } catch { Start-Sleep -Seconds 1 }
          }
          throw 'Synthetic loopback API failed to start.'
      - name: Publish unpackaged Debug app with bundled runtime
        run: dotnet publish native/windows/ApexBooks.Windows.csproj -c Debug -p:Platform=x64 -r win-x64 --self-contained true -p:ApexApiOrigin=http://127.0.0.1:8012 -o "${{ runner.temp }}/windows-ui-app"
      - name: Exercise real login, company switching and invoice detail
        run: dotnet run --project native/tests/WindowsUi -c Release -- "${{ runner.temp }}/windows-ui-app" http://127.0.0.1:8012 "${{ runner.temp }}/windows-ui-evidence"
      - name: Stop synthetic API
        if: always()
        shell: pwsh
        run: |
          $pidFile="$env:RUNNER_TEMP/windows-ui-api.pid"
          if(Test-Path $pidFile){Stop-Process -Id ([int](Get-Content $pidFile)) -ErrorAction SilentlyContinue}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-ui-evidence
          path: |
            ${{ runner.temp }}/windows-ui-evidence
            ${{ runner.temp }}/windows-ui-api*.log
