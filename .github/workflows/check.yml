name: API, web and native checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record checked-out build revision
        shell: bash
        run: |
          revision="$(git rev-parse HEAD)"
          echo "APEX_BUILD_SHA=$revision" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=$revision" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm ci --prefix frontend
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: bash scripts/check.sh
      - name: Rehearse the known 1.3 repository schema upgrade in isolated SQLite
        shell: bash
        run: |
          set -euo pipefail
          baseline=1e8d981149e8a4dce597ec49933b33887bcf00d6
          if ! git cat-file -e "$baseline^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$baseline"
          fi
          python tests/upgrade/rehearse_legacy.py
  browser-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: npm ci --prefix frontend
      - run: python tests/e2e/run_local.py --browser --presentation --business --accessibility --artifacts browser-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-flow-evidence
          path: browser-evidence
  android-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record checked-out build revision
        shell: bash
        run: |
          revision="$(git rev-parse HEAD)"
          echo "APEX_BUILD_SHA=$revision" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=$revision" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preconfigured hosted Android SDK
        run: |
          test -d "$ANDROID_HOME/licenses"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
      # EOF prevents accepting any new license; missing approval fails this step.
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' < /dev/null
      - name: Verify streaming encrypted backups with a 64 MiB test heap
        run: bash ../../android/gradlew -p . verifyBackupStreaming -PlargeMiB=320 --no-daemon --max-workers=2
        working-directory: native/shared/AndroidBackupStreaming
      - run: bash gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
        working-directory: native/android
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify Android HTTP backup and quotation flows on disposable local books
        run: python native/tools/run_android_http_checks.py
      - name: Verify Android PDF and access-denial ownership boundaries
        run: |
          python3 native/tests/AndroidPdfLoading/check.py
          python3 native/tests/AndroidCoreRefresh/check.py
          python3 native/tests/AndroidCashBook/check.py
          python3 native/tests/AndroidEditorAccess/check.py
          python3 native/tests/AndroidResponseSession/check.py
          python3 native/tests/AndroidSaveOwnership/check.py
          python3 native/tests/AndroidLegacyExport/check.py
          python3 native/tests/AndroidSourceSelection/check.py
      - name: Verify restored-company navigation survives dialog disposal
        run: python3 native/tests/AndroidLifecycle/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            native/android/app/build/reports
            native/android/app/build/test-results
  windows-client:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record checked-out build revision
        shell: bash
        run: |
          revision="$(git rev-parse HEAD)"
          echo "APEX_BUILD_SHA=$revision" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=$revision" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build native/windows/ApexBooks.Windows.csproj -c Debug -p:Platform=x64 -p:RuntimeIdentifier=win-x64
      - run: dotnet run --project native/tests/PortableClient/PortableClient.csproj -c Debug
      - run: dotnet run --project native/tests/WindowsClient/WindowsClient.csproj -c Debug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python native/tests/WindowsSaveOwnership/check.py
      - run: python native/tests/WindowsExportContext/check.py
      - name: Verify streaming encrypted backups with a 64 MiB managed heap
        shell: pwsh
        run: |
          dotnet restore native/tests/WindowsBackupStreaming --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "Streaming backup locked restore failed." }
          dotnet build native/tests/WindowsBackupStreaming --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Streaming backup test build failed." }
          $env:DOTNET_GCHeapHardLimit="0x4000000"
          dotnet native/tests/WindowsBackupStreaming/bin/Debug/net10.0/WindowsBackupStreaming.Tests.dll --max
          if ($LASTEXITCODE -ne 0) { throw "Streaming backup bounded-memory checks failed." }
  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: apex_test
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: apex_concurrency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex_test -d apex_concurrency_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Record checked-out build revision
        shell: bash
        run: |
          revision="$(git rev-parse HEAD)"
          echo "APEX_BUILD_SHA=$revision" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=$revision" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python tests/concurrency/test_postgres.py
        env:
          APEX_TEST_DATABASE_URL: postgresql+psycopg://apex_test:synthetic-ci-password@127.0.0.1:5432/apex_concurrency_test
