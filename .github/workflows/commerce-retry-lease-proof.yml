name: Isolated commerce retry lease reproduction
on:
  pull_request:
    paths:
      - 'tests/concurrency/test_commerce_retry_lease*.py'
      - '.github/workflows/commerce-retry-lease-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: commerce-retry-lease-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  disposable-postgres-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: commerce_proof
          POSTGRES_PASSWORD: synthetic-commerce-proof-only
          POSTGRES_DB: apex_concurrency_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U commerce_proof -d apex_concurrency_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install pinned test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify pure target and fresh-schema guards
        working-directory: tests/concurrency
        run: python -m unittest -v test_commerce_retry_lease_guard
      - name: Run proof only after loopback and fresh-empty-schema checks
        env:
          # This credential belongs only to the disposable service above.
          APEX_TEST_DATABASE_URL: postgresql+psycopg://commerce_proof:synthetic-commerce-proof-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/apex_concurrency_test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p commerce-retry-evidence
          # The script rejects remote/overridden targets and any existing user
          # relations before existing migrations or proof DDL. It never resets DBs.
          python tests/concurrency/test_commerce_retry_lease.py \
            --output commerce-retry-evidence/result.json
      - name: Retain bounded synthetic results, including failed proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commerce-retry-lease-proof-${{ github.run_id }}
          path: commerce-retry-evidence/result.json
          if-no-files-found: warn
          retention-days: 7
