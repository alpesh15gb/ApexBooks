name: Android native UI and financial journeys
on:
  workflow_dispatch:
    inputs:
      allow_temporary_kvm_access:
        description: 'Use only for the explicitly approved one-run temporary KVM access test'
        required: false
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: native-device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-device-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JWT_SECRET: synthetic-native-device-ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
        with:
          # One explicitly approved run tests this immutable published candidate.
          ref: ${{ github.event_name == 'pull_request' && github.repository == 'alpesh15gb/ApexBooks' && github.event.number == 1 && github.head_ref == 'codex/end-to-end-hardening' && github.event.pull_request.head.repo.full_name == github.repository && github.run_number == '17' && github.run_attempt == '1' && 'e4a7e9f23b5671d4b5a1340a33e33fe2ee8a4b83' || github.sha }}
      - name: Record checked-out build revision
        shell: bash
        run: |
          revision="$(git rev-parse HEAD)"
          echo "APEX_BUILD_SHA=$revision" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=$revision" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preconfigured hosted Android SDK
        run: |
          test -d "$ANDROID_HOME/licenses"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m pip install -r backend/requirements-dev.txt
      # EOF prevents accepting any new license; missing approval fails this step.
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' < /dev/null
      - name: Start isolated synthetic API
        run: |
          export DATABASE_URL="sqlite:///$RUNNER_TEMP/native-device-isolated.sqlite3"
          (cd backend && python migrate.py)
          python -m uvicorn main:app --app-dir backend --host 127.0.0.1 --port 8012 > "$RUNNER_TEMP/native-device-api.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8012/api/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/native-device-api.log"
          exit 1
      - name: Install and verify device-test prerequisites before privileged access
        run: |
          export ANDROID_USER_HOME="$RUNNER_TEMP/apex-android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_EMULATOR_HOME=$ANDROID_EMULATOR_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          sdk_ready=false
          for attempt in 1 2 3; do
            sdk_log="$RUNNER_TEMP/native-sdk-prerequisites-$attempt.log"
            if sdkmanager 'emulator' 'platform-tools' 'system-images;android-29;google_apis;x86_64' < /dev/null > "$sdk_log" 2>&1; then
              cat "$sdk_log"
              sdk_ready=true
              break
            fi
            cat "$sdk_log"
            if grep -Eiq 'licenses?.*(not accepted|not been accepted)|Accept\? \(y/N\)|Do you accept|Review licenses' "$sdk_log"; then
              echo 'A new SDK license requires explicit approval; stopping without retry or acceptance.' >&2
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          $sdk_ready || { echo 'Official SDK prerequisites failed after three bounded attempts.' >&2; exit 1; }
          test -x "$ANDROID_HOME/emulator/emulator"
          for binary in "$ANDROID_HOME/emulator/emulator" "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64"; do
            test -x "$binary"
            library_log="$RUNNER_TEMP/native-emulator-libraries-$(basename "$binary").log"
            LD_LIBRARY_PATH="$ANDROID_HOME/emulator/lib64:$ANDROID_HOME/emulator/lib64/qt/lib:${LD_LIBRARY_PATH:-}" ldd "$binary" > "$library_log" 2>&1 || { cat "$library_log"; exit 1; }
            cat "$library_log"
            if grep -F 'not found' "$library_log"; then
              echo 'Official emulator has unresolved runtime libraries; stopping before device permission.' >&2
              exit 1
            fi
          done
          "$ANDROID_HOME/emulator/emulator" -version
          command -v adb
          command -v avdmanager
          test -f "$ANDROID_HOME/system-images/android-29/google_apis/x86_64/package.xml"
          printf 'no\n' | avdmanager create avd --force --name ApexLocal --package 'system-images;android-29;google_apis;x86_64' --device pixel_2 --path "$ANDROID_AVD_HOME/ApexLocal.avd"
          test -s "$ANDROID_AVD_HOME/ApexLocal.ini"
          test -s "$ANDROID_AVD_HOME/ApexLocal.avd/config.ini"
          grep -Fx "path=$ANDROID_AVD_HOME/ApexLocal.avd" "$ANDROID_AVD_HOME/ApexLocal.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tr -d '\r' | grep -Fx 'ApexLocal'
      - name: Grant approved one-run runner access to KVM
        id: kvm_access
        if: ${{ github.event_name == 'pull_request' && github.repository == 'alpesh15gb/ApexBooks' && github.event.number == 1 && github.head_ref == 'codex/end-to-end-hardening' && github.event.pull_request.head.repo.full_name == github.repository && github.run_number == '17' && github.run_attempt == '1' }}
        run: |
          test "$(git rev-parse HEAD)" = "e4a7e9f23b5671d4b5a1340a33e33fe2ee8a4b83"
          test -c /dev/kvm
          command -v getfacl
          command -v setfacl
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            getfacl -p /dev/kvm > "$RUNNER_TEMP/kvm-acl.before"
            # Emit before mutation so cleanup also runs if access verification fails.
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          fi
      - name: Check hardware acceleration
        run: |
          test -e /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo 'Hosted runner lacks preconfigured KVM read/write access; device checks require an approved accelerated runner.' >&2
            exit 1
          fi
          "$ANDROID_HOME/emulator/emulator" -accel-check
      # Do not use emulator-runner: it unconditionally accepts all SDK licenses.
      - name: Run hardware-accelerated local device checks
        timeout-minutes: 25
        run: |
          test -s "$ANDROID_AVD_HOME/ApexLocal.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tr -d '\r' | grep -Fx 'ApexLocal'
          export ANDROID_SERIAL=emulator-5554
          "$ANDROID_HOME/emulator/emulator" -port 5554 -avd ApexLocal -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/native-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true; wait "$emulator_pid" 2>/dev/null || true' EXIT
          adb start-server
          booted=false
          for attempt in $(seq 1 120); do
            if [ "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then booted=true; break; fi
            kill -0 "$emulator_pid" || { cat "$RUNNER_TEMP/native-emulator.log"; exit 1; }
            sleep 2
          done
          $booted || { cat "$RUNNER_TEMP/native-emulator.log"; exit 1; }
          adb -s "$ANDROID_SERIAL" shell settings put global window_animation_scale 0
          adb -s "$ANDROID_SERIAL" shell settings put global transition_animation_scale 0
          adb -s "$ANDROID_SERIAL" shell settings put global animator_duration_scale 0
          bash native/tools/run_android_device_checks.sh
      - name: Restore original virtualization-device permissions
        if: ${{ always() && steps.kvm_access.outputs.changed == 'true' }}
        run: |
          test -s "$RUNNER_TEMP/kvm-acl.before"
          sudo setfacl --restore="$RUNNER_TEMP/kvm-acl.before"
          getfacl -p /dev/kvm > "$RUNNER_TEMP/kvm-acl.after"
          cmp "$RUNNER_TEMP/kvm-acl.before" "$RUNNER_TEMP/kvm-acl.after"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-device-evidence
          path: |
            native/android/app/build/reports/androidTests
            native/android/app/build/outputs/androidTest-results
            native/android/app/build/device-evidence
            ${{ runner.temp }}/native-device-api.log
            ${{ runner.temp }}/native-emulator.log
            ${{ runner.temp }}/native-sdk-prerequisites-*.log
            ${{ runner.temp }}/native-emulator-libraries-*.log
