name: Android native UI and financial journeys
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: native-device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-device-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JWT_SECRET: synthetic-native-device-ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Start isolated synthetic API
        run: |
          export DATABASE_URL="sqlite:///$RUNNER_TEMP/native-device-isolated.sqlite3"
          (cd backend && python migrate.py)
          python -m uvicorn main:app --app-dir backend --host 127.0.0.1 --port 8012 > "$RUNNER_TEMP/native-device-api.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8012/openapi.json > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/native-device-api.log"
          exit 1
      # Setup follows the emulator action's documented Linux KVM configuration.
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: false
          script: bash native/tools/run_android_device_checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-device-evidence
          path: |
            native/android/app/build/reports/androidTests
            native/android/app/build/outputs/androidTest-results
            native/android/app/build/device-evidence
            ${{ runner.temp }}/native-device-api.log
