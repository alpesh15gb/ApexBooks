server {
  listen 80;
  client_max_body_size 8m;
  proxy_read_timeout 90s;
  root /usr/share/nginx/html;
  # Redirects such as /features -> /features/ stay relative so they keep https behind the TLS proxy.
  absolute_redirect off;
  charset utf-8;
  charset_types text/plain text/xml application/xml text/css application/javascript application/json application/manifest+json;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml application/manifest+json;
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  # Hashed build assets never change; everything else is revalidated so releases show immediately.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location = /robots.txt { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
  location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
  location = /llms.txt { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
  location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
